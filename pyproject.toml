[project]
name = "hwreview"
version = "0.1.0"
description = "Teacher-reviewed draft feedback for synthetic math homework PDFs (hackathon component)"
requires-python = ">=3.11"
dependencies = ["pydantic>=2.11", "pypdf>=5"]

[project.optional-dependencies]
dev = ["pytest>=8", "fpdf2>=2.8"]

[project.scripts]
hwreview = "hwreview.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
